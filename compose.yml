services:
  dev:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - UID=${UID}
        - GID=${GID}
    network_mode: host
    volumes:
      - .:/user/ros2_ws
    devices:
      - /dev/video0:/dev/video0
    environment:
      - ROS_DOMAIN_ID=33
    command: ros2 run v4l2_camera v4l2_camera_node
